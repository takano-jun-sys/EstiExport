<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 24px;
      line-height: 1.6;
    }

    .container {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      max-width: 600px;
      margin: 0 auto;
    }

    h2 {
      color: #ffffff;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .info {
      background: #1e3a5f;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      border-left: 4px solid #4A86E8;
    }

    .info strong {
      color: #ffffff;
      font-weight: 600;
    }

    .info-row {
      margin-bottom: 8px;
    }

    .info-row:last-child {
      margin-bottom: 0;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 4px;
    }

    .badge.first {
      background: #0d7a5f;
      color: #ffffff;
    }

    .badge.repeat {
      background: #1a5490;
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #b0b0b0;
      font-size: 14px;
      letter-spacing: 0.2px;
    }

    label .required {
      color: #ff6b6b;
      margin-left: 4px;
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px 14px;
      background: #1a1a1a;
      border: 1.5px solid #404040;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #4A86E8;
      background: #222222;
      box-shadow: 0 0 0 3px rgba(74, 134, 232, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .button-group {
      margin-top: 28px;
      text-align: right;
    }

    button {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    button[type="submit"] {
      background: linear-gradient(135deg, #4A86E8 0%, #3b6fc5 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(74, 134, 232, 0.3);
    }

    button[type="submit"]:hover {
      background: linear-gradient(135deg, #3b6fc5 0%, #2d5ba8 100%);
      box-shadow: 0 6px 16px rgba(74, 134, 232, 0.4);
      transform: translateY(-1px);
    }

    button[type="submit"]:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }

    .status.success {
      background: #0d4d3d;
      color: #4ade80;
      border: 1.5px solid #166534;
    }

    .status.success a {
      color: #60efff;
      text-decoration: none;
      font-weight: 600;
      margin-top: 8px;
      display: inline-block;
      transition: color 0.2s;
    }

    .status.success a:hover {
      color: #93f5ff;
      text-decoration: underline;
    }

    .status.error {
      background: #4d0d0d;
      color: #ff8b8b;
      border: 1.5px solid #651616;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 32px;
    }

    .spinner {
      border: 4px solid #404040;
      border-top: 4px solid #4A86E8;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading p {
      color: #b0b0b0;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>見積書 Export</h2>

    <div class="info">
      <div class="info-row"><strong>Job ID:</strong> <?= jobData.jobId ?></div>
      <div class="info-row"><strong>案件名:</strong> <?= jobData.案件名 ?></div>
      <div class="info-row"><strong>Project ID:</strong> <?= jobData.projectId ?></div>
      <div class="info-row">
        <?  if (!isFirstTime) { ?>
          <span class="badge repeat">2回目以降のExport - 前回の入力内容を引き継ぎ</span>
        <? } else { ?>
          <span class="badge first">初回Export - 情報を入力してください</span>
        <? } ?>
      </div>
    </div>

    <form id="quoteForm">
      <div class="form-group">
        <label for="clientName">クライアント名<span class="required">*</span></label>
        <input type="text" id="clientName" name="clientName" value="<?= jobData.クライアント名 ?>" required>
      </div>

      <div class="form-group">
        <label for="productName">品名<span class="required">*</span></label>
        <input type="text" id="productName" name="productName" value="<?= jobData.品名 ?>" required>
      </div>

      <div class="form-group">
        <label for="spec1">仕様1</label>
        <textarea id="spec1" name="spec1"><?= jobData.仕様1 ?></textarea>
      </div>

      <div class="form-group">
        <label for="spec2">仕様2</label>
        <textarea id="spec2" name="spec2"><?= jobData.仕様2 ?></textarea>
      </div>

      <div class="form-group">
        <label for="spec3">仕様3</label>
        <textarea id="spec3" name="spec3"><?= jobData.仕様3 ?></textarea>
      </div>

      <div class="form-group">
        <label for="spec4">仕様4</label>
        <textarea id="spec4" name="spec4"><?= jobData.仕様4 ?></textarea>
      </div>

      <div class="form-group">
        <label for="staff">担当<span class="required">*</span></label>
        <input type="text" id="staff" name="staff" value="<?= jobData.担当 ?>" required>
      </div>

      <div class="button-group">
        <button type="submit">見積書を生成</button>
      </div>
    </form>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>見積書を生成中...</p>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script>
    const jobId = '<?= jobData.jobId ?>';

    document.getElementById('quoteForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // フォームデータを取得
      const formData = {
        クライアント名: document.getElementById('clientName').value,
        品名: document.getElementById('productName').value,
        仕様1: document.getElementById('spec1').value,
        仕様2: document.getElementById('spec2').value,
        仕様3: document.getElementById('spec3').value,
        仕様4: document.getElementById('spec4').value,
        担当: document.getElementById('staff').value
      };

      // ローディング表示
      document.getElementById('quoteForm').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('status').style.display = 'none';

      // GAS関数を呼び出し
      google.script.run
        .withSuccessHandler(onSuccess)
        .withFailureHandler(onFailure)
        .generateQuote(jobId, formData);
    });

    function onSuccess(result) {
      document.getElementById('loading').style.display = 'none';

      if (result.success) {
        const statusDiv = document.getElementById('status');
        statusDiv.className = 'status success';
        statusDiv.innerHTML = `
          <strong>✓ ${result.message}</strong><br><br>
          <a href="${result.spreadsheetUrl}" target="_blank">📊 スプレッドシートを開く</a><br>
          <a href="${result.pdfUrl}" target="_blank">📄 PDFを開く</a>
        `;
        statusDiv.style.display = 'block';
      } else {
        showError(result.error);
      }
    }

    function onFailure(error) {
      showError(error.message);
    }

    function showError(message) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('quoteForm').style.display = 'block';

      const statusDiv = document.getElementById('status');
      statusDiv.className = 'status error';
      statusDiv.innerHTML = `<strong>✗ エラー:</strong> ${message}`;
      statusDiv.style.display = 'block';
    }
  </script>
</body>
</html>
